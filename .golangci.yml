# Formato v2 de golangci-lint. El set "standard" (errcheck, govet,
# staticcheck, ineffassign, unused) más gosec como capa SAST.
version: "2"
linters:
  default: standard
  enable:
    - gosec
  settings:
    errcheck:
      # Escrituras de diagnóstico a stdout/stderr: un fallo de Fprint* no es
      # accionable (no hay a dónde reportarlo) y comprobarlo solo añade ruido.
      # Exclusión idiomática; el resto de errores SÍ se exigen.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
