name: korven_open_tv
description: "Korven Open TV — televisión abierta, del núcleo a la obra."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  # Fuentes de marca empaquetadas, no vía google_fonts: ese paquete descarga en
  # el primer arranque, lo que en una app de escritorio es una dependencia de
  # red innecesaria y un parpadeo tipográfico. Son fuentes variables, así que un
  # fichero por familia cubre todos los pesos del sistema.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
