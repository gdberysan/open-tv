version: 2

project_name: open-tv

# El binario embebe el cliente web (internal/ui/dist vía go:embed). goreleaser
# solo ejecuta `go build`, que da por hecho que ese directorio ya está
# construido — así que el paso previo compila el cliente Svelte ANTES de que
# arranque cualquier build de Go. Sin este hook, `goreleaser build`/`release`
# local produce un binario que sirve el `dist/` que hubiera en el árbol (o
# falla si está vacío), no el cliente real de este commit.
before:
  hooks:
    # before.hooks solo admite comandos sueltos (sin cmd/dir estructurado,
    # eso es exclusivo de los hooks a nivel de build) — de ahí el `sh -c` con
    # `cd web &&` para correrlos en el subdirectorio del cliente.
    - sh -c "cd web && npm ci"
    - sh -c "cd web && npm run build"
    # El build vacía internal/ui/dist y borra el .gitkeep versionado.
    - git checkout -- internal/ui/dist/.gitkeep

builds:
  - id: open-tv
    main: ./cmd/open-tv
    binary: open-tv
    # El proyecto usa modernc/sqlite (Go puro): CGO_ENABLED=0 ya es lo que
    # hace un `go build` normal aquí (verificado), así que fijarlo explícito
    # solo documenta la garantía, no la cambia.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No hay build objetivo para Windows en ARM64 en este plan.
      - goos: windows
        goarch: arm64
    # main.go: "var version = "dev"" — el propio comentario del código dice
    # que el linker la inyecta en releases con -X main.version=…; esa es la
    # única variable de versión que existe, no se inventa ninguna otra.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids:
      - open-tv
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

# Las notas de cada release se generan a partir del historial de commits
# (ya en español, con el prefijo Conventional Commits del repo) en vez de
# duplicar contenido con CHANGELOG.md; los grupos de abajo solo traducen las
# cabeceras al español para que la página de Releases quede consistente con
# el resto del proyecto.
changelog:
  use: git
  sort: asc
  groups:
    - title: "Novedades"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Correcciones"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Otros cambios"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"

# Cask de Homebrew empujado al tap propio (gdberysan/homebrew-tap), NO al repo
# del proyecto. El push real solo ocurre dentro de `goreleaser release` cuando
# corre contra un tag — este fichero no dispara nada por sí solo.
# La credencial es una deploy key con escritura sobre ese repo, guardada como
# secret de Actions (HOMEBREW_TAP_SSH_KEY), nunca aquí.
#
# CASK y no `brews`: goreleaser deprecó `brews` y `goreleaser check` fallaba por
# ello. El cambio NO es solo de nombre — los casks son SOLO macOS, así que
# `brew install` en Linux (Linuxbrew) deja de estar cubierto. Para Linux queda
# install.sh, que ya detecta sistema y arquitectura y verifica el checksum antes
# de instalar nada.
homebrew_casks:
  - name: open-tv
    ids:
      - default
    binaries:
      - open-tv
    repository:
      owner: gdberysan
      name: homebrew-tap
      branch: main
      # Push por SSH con una DEPLOY KEY del tap, no con un PAT. Un PAT hay
      # que crearlo a mano en el navegador, caduca y —aunque sea de grano
      # fino— es una credencial de la cuenta; una deploy key se crea desde la
      # CLI, no caduca y solo puede escribir en ESE repositorio. Menos
      # permiso, menos mantenimiento.
      git:
        url: "git@github.com:gdberysan/homebrew-tap.git"
        # goreleaser espera la RUTA del fichero, no la clave: el workflow la
        # materializa desde el secret antes de llamarlo.
        private_key: "{{ .Env.HOMEBREW_TAP_KEY_PATH }}"
        # `.Env.X` es campo de plantilla documentado; se usa el MISMO valor que
        # `private_key` a propósito. Se evitó `{{ .KeyPath }}` (que aparece en
        # ejemplos sueltos) porque no está en el esquema ni en la documentación,
        # y esta línea solo se ejecuta DESPUÉS de empujar el tag: un fallo aquí
        # se paga con una release a medias contra una etiqueta ya publicada.
        ssh_command: "ssh -i {{ .Env.HOMEBREW_TAP_KEY_PATH }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
    directory: Casks
    homepage: "https://github.com/gdberysan/open-tv"
    description: "Reproductor de televisión abierta (FTA): un solo binario, tus propias listas M3U."
    url:
      template: >-
        https://github.com/gdberysan/open-tv/releases/download/{{ .Tag }}/{{ .ArtifactName }}
      # El homepage y el dominio de descarga coinciden (los dos son GitHub), y
      # declararlo es lo que evita que `brew audit` se queje.
      verified: "github.com/gdberysan/open-tv"
    commit_author:
      name: gdberysan
      email: gdberysan@gmail.com
    commit_msg_template: "chore(tap): actualiza open-tv a {{ .Tag }}"
    # El binario no va firmado ni notarizado, así que sin esto Gatekeeper lo
    # pone en cuarentena y no arranca. Es el hook que la propia documentación
    # de goreleaser recomienda para este caso.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/open-tv"]
          end
