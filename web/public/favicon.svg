<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon de Korven Open TV.

  MISMO dibujo que EmblemaKorven.svelte y que /marca/korven-emblema.svg: los
  vértices del hexágono son idénticos (64,12 · 110,38 · 110,90 · 64,116 ·
  18,90 · 18,38) y el reparto de tonos sale de la misma luz clave del modelo
  3D, arriba a la derecha — el eje 60°-240° va de la faceta más clara a la
  más oscura. Lo único que cambia es el viewBox: se recorta a 8,8 112x112
  para que la marca llene la caja (una pestaña son 16px, ahí el margen es
  espacio tirado), sin mover ni una coordenada.

  Tamaño óptico, a 16px: fuera las seis aristas interiores y el cursor «<» —
  a ese tamaño miden menos de un píxel y solo ensucian. Queda lo que de
  verdad se reconoce de un vistazo: la silueta hexagonal y el ojo ámbar, un
  punto más grande que en la app (r=11 en vez de 9) por la misma razón.

  Los colores van en hexadecimal a pelo, no en tokens, y no puede ser de
  otra forma: esto es un fichero suelto que el navegador pinta fuera del
  documento, sin acceso a las variables CSS del cliente. Son exactamente los
  valores de estilos/tokens/colors.css — si allí cambian, aquí a mano:
    #283142 graphite-600 · #1D2533 graphite-700 · #171E29 graphite-750
    #121826 graphite-800 · #EFF3F8 graphite-050 · #FF8A2B amber-500
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 112 112" width="128" height="128"
     role="img" aria-label="Korven Open TV">

  <!-- Cuerpo facetado, iluminado desde arriba a la derecha. -->
  <g stroke-linejoin="round">
    <polygon points="64,64 64,12 110,38" fill="#283142"/>
    <polygon points="64,64 110,38 110,90" fill="#1D2533"/>
    <polygon points="64,64 110,90 64,116" fill="#171E29"/>
    <polygon points="64,64 64,116 18,90" fill="#121826"/>
    <polygon points="64,64 18,90 18,38" fill="#171E29"/>
    <polygon points="64,64 18,38 64,12" fill="#1D2533"/>
  </g>

  <!-- Canto de hueso en dos capas: el hexágono entero al tono bajo (cierra
       la silueta sin costuras en las esquinas) y encima solo las aristas
       que la luz levanta. Un contorno plano lo convertiría en pegatina. -->
  <polygon points="64,12 110,38 110,90 64,116 18,90 18,38"
           fill="none" stroke="#EFF3F8" stroke-width="3" stroke-linejoin="round" opacity=".5"/>
  <g stroke="#EFF3F8" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="12" x2="110" y2="38" opacity="1"/>
    <line x1="110" y1="38" x2="110" y2="90" opacity=".6"/>
    <line x1="18" y1="38" x2="64" y2="12" opacity=".6"/>
    <line x1="110" y1="90" x2="64" y2="116" opacity=".2"/>
    <line x1="18" y1="90" x2="18" y2="38" opacity=".2"/>
  </g>

  <!-- El ojo ámbar: la señal viva, y lo único que sobrevive a 16px. -->
  <circle cx="64" cy="64" r="11" fill="#FF8A2B"/>
</svg>
