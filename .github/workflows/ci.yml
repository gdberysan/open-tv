name: CI

on:
  # Sin lista de ramas: el gate vale para cualquier rama. Con una lista fija se
  # queda obsoleta en cuanto se crea una rama nueva y el trabajo se mergea sin
  # haber pasado nunca por CI.
  push:
  pull_request:
    branches: [main]

jobs:
  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  web:
    name: Cliente web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # ffmpeg genera el fixture HLS del e2e. Ya viene en la imagen de
      # ubuntu-latest, pero fijarlo evita que un cambio de imagen rompa el
      # e2e con un error que no dice nada.
      - name: ffmpeg
        run: ffmpeg -version | head -1

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: svelte-check
        working-directory: web
        run: npm run check

      - name: vitest
        working-directory: web
        run: npm test

      - name: build del cliente
        working-directory: web
        run: npm run build

      - name: presupuesto de bundle (<= 80 KB gzip de JS propio)
        working-directory: web
        run: |
          # El JS propio es el chunk de entrada, NO el de hls.js (perezoso).
          # Fix final, hallazgo 4: si Vite renombrara el chunk de entrada
          # (deja de matchear 'index-*.js'), find no devolvería nada, total
          # quedaría en 0 y "0 -gt 81920" es falso — el gate pasaría en
          # silencio sin medir nada. Se cuenta ANTES de medir: exactamente
          # UN chunk de entrada, o falla explícito con ::error::.
          # $(( n )) normaliza el resultado de `wc -l` a un entero limpio
          # (sin espacios de relleno, que algunas implementaciones de wc sí
          # anteponen) sin depender de mapfile/readarray (bash 4+).
          n=$(find ../internal/ui/dist/assets -maxdepth 1 -name 'index-*.js' | wc -l)
          n=$((n))
          if [ "$n" -ne 1 ]; then
            echo "::error::se esperaba exactamente 1 chunk de entrada index-*.js en internal/ui/dist/assets, se encontraron ${n}"
            exit 1
          fi
          archivo=$(find ../internal/ui/dist/assets -maxdepth 1 -name 'index-*.js')
          total=$(gzip -c "$archivo" | wc -c)
          echo "JS propio inicial: ${total} bytes gzip"
          if [ "$total" -gt 81920 ]; then
            echo "::error::el bundle propio supera 80 KB gzip (${total} B)"; exit 1
          fi

      # El embed es lo que convierte cliente y binario en un solo artefacto:
      # si el build del cliente no aterriza donde Go lo espera, falla aquí.
      - name: go build con el cliente embebido
        run: go build ./... && go test ./internal/ui/...

      - name: navegadores de Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: e2e
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  seguridad:
    name: Seguridad
    uses: gdberysan/.github/.github/workflows/security.yml@main
    permissions:
      contents: read
      # gitleaks-action llama a la API de PR commits cuando el evento es
      # pull_request; sin este scope el job falla con 403 "Resource not
      # accessible by integration" aunque no haya secretos.
      pull-requests: read
